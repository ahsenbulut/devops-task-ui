sonar.organization=ahsenbulut
sonar.projectKey=ahsenbulut_devops-task-ui
sonar.projectName=devops-task-ui

sonar.sources=src
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,src/test/**,src/**/*.test.ts,src/**/*.test.tsx
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.sourceEncoding=UTF-8

sonar.typescript.tsconfigPaths=tsconfig.app.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
